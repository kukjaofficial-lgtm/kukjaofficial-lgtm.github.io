ko:
  kicker: 우리의 시선으로 그리는 한일의 과거와 현재, 그리고 미래
  slogan_line1: 솔직한 시선,
  slogan_line2: 진솔한 대화
  intro: KUKJA는 고려대학교의 한국인·일본인 학생이 주체적으로 모여 만든, 양국의 역사와 사회에 대해 토론을 나누며 더 나은 미래를
    고민하는 소모임입니다.
  next_date: 10월 7일 오후 6시 30분
  next_place: 고려대학교 문과대학 서관 404호
  next_topic: 다음 주제는 곧 공지됩니다
  themes:
    - word: 과거
      title: 우리의 대화로 그려나가는 역사
      text: 서로 다르게 배워 온 역사를 나란히 놓고, 갈등을 넘어서기 위해 함께 간직해야 할 가치를 찾습니다.
    - word: 현재
      title: 우리가 살아가는 지금 이곳
      text: 두 나라가 함께 겪고 있는 사회 문제에 대해 더 나은 해법을 찾기 위해 머리를 맞댑니다.
    - word: 미래
      title: 우리의 시선이 바꿀 더 나은 세상
      text: 미래를 함께하는 파트너로서 우리가 누릴 더 멋진 세상을 이야기합니다.
  join_text: 한국어나 일본어 둘 중 한 쪽이 서툴러도 괜찮습니다. 고려대학교 재학생이나 교환학생이라면 누구나 모임에 참여할 수 있습니다.
    회비는 없습니다. 참여를 희망하시는 분은 메일로 연락을 주시기 바랍니다.
ja:
  kicker: 私たちの描く日韓の過去と現在、そして未来。
  slogan_line1: 率直な視線、
  slogan_line2: 正直な対話。
  intro: KUKJAは、高麗大学に在学する日韓両国の学生が主体的に立ち上げた、両国の歴史や社会について討論しながらよりよい未来を築くための我々の役割を考えるサークルです。
  next_date: 毎週水曜日 午後6時30分
  next_place: 高麗大学文科大学西館404号
  next_topic: 次回のテーマは近日お知らせします
  themes:
    - word: 過去
      title: 私たちの対話で呼び起こす歴史
      text: 私たちが習ってきたそれぞれの歴史を前に、論争を乗り越えともに大切にするべき価値を探します。
    - word: 現在
      title: 私たちの住んでいる今、ここ
      text: 日韓両国がともに抱えている社会問題についてより良い解決策を見つけるために話し合います。
    - word: 未来
      title: 私たちの織り成すより良い世界
      text: 未来を共にするパートナーとして我々の享受する素敵な世の中を語り合います。
  join_text: 韓国語や日本語が苦手でも大丈夫です。高麗大学の在学生および交換学生なら誰でも参加できます。入会費はありません。入会にあたっては、メールでのお申し込みをお願いします。
