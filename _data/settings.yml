ko:
  kicker: 우리의 시선으로 그리는 한일의 과거와 현재, 그리고 미래
  slogan_line1: 서로를 마주 보고,
  slogan_line2: 진솔하게 대화하다
  intro: KUKJA는 고려대학교의 한국인·일본인 학생이 주체적으로 모여 만든, 양국의 역사와 사회에 대해 토론을 나누며 더 나은 미래를
    고민하는 소모임입니다.
  next_date: 10월 7일 오후 6시 30분
  next_place: 고려대학교 문과대학 서관 404호
  next_topic: 다음 주제는 곧 공지됩니다
  themes:
    - word: 과거
      title: 역사를 마주하기
      text: 서로 다르게 배워 온 역사를 나란히 놓고, 무엇을 기억하고 어떻게 말해야 할지 함께 생각합니다.
    - word: 현재
      title: 두 사회를 이해하기
      text: 노동, 젠더, 이민, 청년의 삶처럼 두 나라가 함께 겪고 있는 문제를 각자의 자리에서 이야기합니다.
    - word: 미래
      title: 더 나은 관계를 만들기
      text: 다음 세대의 한일 관계를 위해 우리가 지금 할 수 있는 일을 찾습니다.
  join_text: 한국어나 일본어, 어느 쪽이 서툴러도 괜찮습니다. 고려대학교 학생이라면 누구나 모임에 참여할 수 있습니다.
ja:
  kicker: 歴史と社会、そして未来をともに
  slogan_line1: 向き合い、
  slogan_line2: ともに語る。
  intro: KUKJAは、高麗大学の韓国人・日本人学生が毎週集まり、二つの社会の今を語り合い、共有する歴史にどう向き合い、どんな未来をつくっていくかを討論するサークルです。
  next_date: 毎週木曜日 午後7時
  next_place: 高麗大学（場所は毎週お知らせします）
  next_topic: 次回のテーマは近日お知らせします
  themes:
    - word: 過去
      title: 歴史に向き合う
      text: それぞれ異なる形で学んできた歴史を並べてみて、何を記憶し、どう語るべきかを一緒に考えます。
    - word: 現在
      title: 二つの社会を知る
      text: 労働、ジェンダー、移民、若者の暮らしなど、両国がともに抱える課題をそれぞれの立場から語り合います。
    - word: 未来
      title: よりよい関係をつくる
      text: 次の世代の日韓関係のために、私たちが今できることを探します。
  join_text: 韓国語や日本語が苦手でも大丈夫です。高麗大学の学生なら誰でも参加できます。
